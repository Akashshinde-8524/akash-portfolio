<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Akash Shinde — Frontend Developer / Full Stack Development Learner. Portfolio of projects, experience and skills."
    />

    <!-- Open Graph / social link previews. Single static set (this is a
         client-rendered SPA without per-route server rendering) — good
         enough for a personal portfolio; a crawler or share card will see
         this regardless of which page was actually shared. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Akash Shinde — Portfolio" />
    <meta
      property="og:description"
      content="Frontend Developer / Full Stack Development Learner. Portfolio of projects, experience and skills."
    />
    <meta property="og:image" content="/images/portrait.jpg" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Akash Shinde — Portfolio" />
    <meta
      name="twitter:description"
      content="Frontend Developer / Full Stack Development Learner. Portfolio of projects, experience and skills."
    />
    <meta name="twitter:image" content="/images/portrait.jpg" />

    <title>Akash Shinde — Portfolio</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
